name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.2
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Dubai
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing + Yandex + Microsoft AI Search)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          KEY="d935af2161e6d47a33c5e7d056cdc59f"
          HOST="toys.aimuse.ae"
          # Pull sitemap URLs (max 10K per IndexNow request, we send up to 100 critical URLs)
          URLS=$(curl -s "https://$HOST/en/sitemap.xml" | grep -oE '<loc>[^<]+' | sed 's|<loc>||' | head -100 | jq -R . | jq -c -s .) || true
          if [ -z "$URLS" ] || [ "$URLS" = "[]" ]; then
            URLS='["https://toys.aimuse.ae/"]'
          fi
          BODY=$(jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "https://$HOST/$KEY.txt" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          echo "Submitting $(echo $URLS | jq length) URLs to IndexNow..."
          curl -fsSL -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            && echo "IndexNow OK" \
            || echo "IndexNow non-fatal (continuing)"
